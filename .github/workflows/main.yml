name: Tests

on:
  push:
    branches:
      - main
      - feature/*

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        rubygems: 3.0.3
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake test

    services:
      imap:
        image: ghcr.io/joeyates/docker-imap-devel@sha256:6d6a64c32e2c583222d75286aa46a04ada5aea76efa36117815bf0e19d5063b6
        ports:
        - "8993:993"
        env:
          MAILNAME: example.com
          MAIL_ADDRESS: address@example.com
          MAIL_PASS: pass
      other-imap:
        image: ghcr.io/joeyates/docker-imap-devel@sha256:6d6a64c32e2c583222d75286aa46a04ada5aea76efa36117815bf0e19d5063b6
        ports:
        - "9993:993"
        env:
          MAILNAME: other.org
          MAIL_ADDRESS: email@other.org
          MAIL_PASS: pass
          DOVECOT_PUBLIC_NAMESPACE_PREFIX: other_public
