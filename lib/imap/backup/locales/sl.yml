      help: "pomoč"
      help_text: |
	Ta zaslon vam omogoča konfiguracijo nastavitev povezave in varnostnega kopiranja za en sam e-poštni račun.

	Nastavitve povezave:
	- `e-račun` in `geslo` - Poverilnice za račun
	- `server` - Strežnik, s katerim se bo povezal ta račun. Tega vam ni treba nastaviti, če uporabljate enega od naslednjih: GMail, Apple Mail, FastMail, PurelyMail.
	V nasprotnem primeru boste morali nastaviti strežnik IMAP vašega ponudnika e-pošte.
	- `možnosti povezave` - (Napredna nastavitev) To vam omogoča, da določite dodatne možnosti za povezavo IMAP.
	Nastavitve morajo biti zapisane v obliki objekta JSON s ključi, ki ustrezajo možnostim, opisanim v dokumentaciji standardne knjižnice Ruby `net/imap`:
	https://ruby-doc.org/stdlib-3.2/libdoc/net/imap/rdoc/Net/IMAP.html#initialize-instance_method
	Če vaš strežnik na primer uporablja SSL, vendar ima neveljavno potrdilo, lahko to nastavite na `{"ssl": {"verify_mode": "none"}}`.

	Da so vaše nastavitve povezave pravilne preizkusite tako da izberete možnost »preizkusi povezavo«.

	Nastavitve varnostnega kopiranja:
	- `način` - »obdrži vsa sporočila« pomeni, da bodo e-poštna sporočila, ki so kasneje izbrisana s strežnika, še vedno shranjena v varnostni kopiji, medtem ko »zrcali sporočila« pomeni, da bodo e-poštna sporočila, izbrisana s strežnika, izbrisana tudi iz varnostne kopije.
	- `pot do varnostne kopije` - Mapa na vašem lokalnem računalniku, kjer bo shranjena varnostna kopija za ta račun.
	- `način vključitve map` - Ta nastavitev določa, da izberete mape, ki jih želite *vključiti* v varnostno kopijo (način belega seznama) ali *izključiti* iz varnostne kopije (način črnega seznama).
	V načinu belega seznama začnete s praznim naborom map in izberete, katere mape želite dodati v varnostno kopijo.
	V načinu črnega seznama začnete z vsemi mapami, vključenimi v varnostno kopijo, in izberete, katere mape želite izključiti.
	- `velikost večkratnega pridobivanja` - Število e-poštnih sporočil, ki jih med varnostnim kopiranjem pridobivam hkrati.
	Povečanje te vrednosti lahko pospeši varnostno kopiranje, vendar tudi poveča porabo pomnilnika.
	- `popravi spremembe zastavic 'UNREAD'` - Ali naj se spremembe zastavic 'UNREAD' med prenosom ponastavijo.
	Ta zastavica je uporabna, ko ponudnik e-pošte (npr. Apple Mail) označi e-poštna sporočila kot prebrana, ko so prenesena, npr. z imap-backup.
	- `status` - Račun je privzeto »aktiven« in bo varnostno kopiran, ko zaženete ukaz za varnostno kopiranje.
	Račun lahko nastavite tudi na »arhiviran«, če želite prenehati z izvajanjem varnostnih kopij; v tem primeru lahko v prihodnosti še vedno izvedete selitev na nov strežnik z ukazom `kopiraj`.
	Če pa želite varnostno kopijo računa samo shraniti na disku, status nastavite na »brez povezave«, .
    global_options:
      title: "Globalne možnosti"
      description: "Te nastavitve vplivajo na vse račune."
      change_download_strategy: "spremeni strategijo prenosa (trenutno: '%{current}')"
      help: "pomoč"
      help_text: |
        Na tem zaslonu lahko spremenite nastavitve, ki vplivajo na vse račune.

        Razpoložljive globalne možnosti:
        - `strategija prenosa` - Ta nastavitev določa, kako pogosto se podatki zapisujejo na disk med varnostnim kopiranjem.
           Privzeta nastavitev (»zakasnitev pisanja metapodatkov«) je hitrejša in manj obremenjuje disk,
           medtem ko »zapiši neposredno na disk« porabi manj pomnilnika in je primerna za naprave z omejenim pomnilnikom.
           Izberite to možnost za več podrobnosti o razlikah med tema strategijama.
      download_strategy_chooser:
        title: "Izberi strategijo prenosa"
        current_marker: " <- privzeta"
        help: "pomoč"
        help_text: |
          Ta nastavitev spremeni, kako pogosto se podatki zapisujejo na disk med varnostnim kopiranjem.

          imap-backup uporablja dve datoteki na mapo, datoteko .mbox z dejanskimi sporočili in datoteko .imap z metapodatki, 
          kot so dolžine sporočil in njihovi odmiki znotraj datoteke .mbox.

          # 'zapiši neposredno na disk'

          S to nastavitvijo se vsako sporočilo in njegovi metapodatki zapišejo na disk med prenosom.

          Ta možnost porabi najmanj pomnilnika in je zato primerna za varnostno kopiranje na naprave z omejenim pomnilnikom, 
          kot je na primer Raspberry Pi.

          # 'zakasnitev pisanja metapodatkov'

          To je privzeta nastavitev.

          Tukaj se sporočila (ki so lahko zelo velika) dodajo v datoteko .mbox, ko so prejeta, vendar se metapodatki 
          zapišejo v datoteko .imap šele, ko so vsa sporočila v mapi prenesena.

          Ta možnost porabi nekoliko več pomnilnika kot prejšnja nastavitev, vendar je **veliko** hitrejša za 
          velike mape (potencialno >30-krat za mape z >100.000 sporočili) in manj obremenjuje disk.

          # Druge nastavitve delovanja

          Druga nastavitev, ki vpliva na delovanje varnostnega kopiranja, je nastavitev na ravni 
          računa `velikost večkratnega pridobivanja`.
